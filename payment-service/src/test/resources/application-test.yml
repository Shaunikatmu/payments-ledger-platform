# Used by integration tests (@ActiveProfiles("test")). Points at the
# payments_test_db database inside the same payment-db container used for
# local dev -- see payment-service/init-db and docs/DECISIONS.md for why
# this exists instead of Testcontainers.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/payments_test_db
    username: payments
    password: payments
    hikari:
      # Default pool size (10) isn't enough for LedgerConcurrencyIT's
      # 50-way concurrent load -- each idempotency poll attempt opens its
      # own REQUIRES_NEW connection, so 50 threads can easily want more
      # than 10 connections at once, especially on a slower CI runner.
      maximum-pool-size: 30
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

# Diagnostic: the production default poll budget is 100x50ms (5s). Widened
# here to 300x50ms (15s) -- still well inside LedgerConcurrencyIT's own
# 30s-per-thread ceiling -- so the next CI run tells us whether the
# sameIdempotencyKeySentConcurrentlyHoldsFundsExactlyOnce() failure is
# really a timing issue under 50-way concurrency, or something else (the
# IdempotencyTimeoutException handler now logs at WARN either way, so a
# real timeout will show up explicitly in the console instead of just an
# unexplained non-201 status).
app:
  idempotency:
    poll:
      max-attempts: 300
      interval-ms: 50
