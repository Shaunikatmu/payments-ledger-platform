dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
}

// Testcontainers was dropped for this project's scope (see
// docs/DECISIONS.md) in favor of a plain, explicit split:
//   ./gradlew test            -- fast unit tests, no external dependencies
//   ./gradlew integrationTest -- needs `docker compose up -d`; runs against
//                                 the payments_test_db database
tasks.named('test') {
    filter {
        excludeTestsMatching '*IT'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (*IT) against the dockerized payments_test_db.'
    group = 'verification'
    useJUnitPlatform()
    filter {
        includeTestsMatching '*IT'
    }
    systemProperty 'spring.profiles.active', 'test'
    shouldRunAfter test
}
